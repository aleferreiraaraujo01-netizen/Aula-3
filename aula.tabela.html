<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <h1>elementos das tabelas</h1>
    <p>
        As tabelas em html são usadas para organizar
        dados em limhas e colunas.
    </p>
    <table border="1">
         <thead>
            <tr>
            <th>nome</th>
            <th>idade</th>
            <th>cidade</th>
        </tr>
         </thead>
         <tbody>
            <tr>
                <td>Alexandre</td>
                <td>18</td>
                <TD>São Paulo</TD>
            </tr>
            <tr>
                <td>Pedro</td>
                <td>18</td>
                <td>Rio de Janeiro</td>
            </tr>
         </tbody>
    </table>
</body>
</html>
